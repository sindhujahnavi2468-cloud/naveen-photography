<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Naveen Photography — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1e1214;--ivory:#f5f1ee;--paper:#faf9f7;--wine:#4a1522;--wine2:#b5543c;--brass:#d4a030;--line:rgba(74,21,34,.12);--muted:#8a7a78;--danger:#c0392b;--ok:#27ae60;--serif:'DM Serif Display',Georgia,serif;--sans:'Jost',sans-serif}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;min-height:100vh}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
[hidden]{display:none!important}

#login{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:900}
.lbox{background:var(--paper);padding:44px 40px;width:min(420px,92vw);border-top:4px solid var(--brass)}
.lbox h1{font-family:var(--serif);font-weight:300;font-size:32px;margin-bottom:6px}
.lbox p{color:var(--muted);margin-bottom:26px}
.lbox label{font-size:14px;font-weight:500;display:block;margin-bottom:6px}
.lbox input{width:100%;padding:12px 14px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;margin-bottom:18px}
.lbox button{width:100%;padding:14px;background:var(--wine);color:#fff;border:0;font-weight:600;font-size:15px;cursor:pointer}
.lbox button:hover{background:var(--wine2)}
.lerr{color:var(--danger);font-size:14px;margin-top:12px;min-height:20px}

.top{position:sticky;top:0;z-index:100;background:var(--ink);color:#fff;height:60px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top .logo{font-family:var(--serif);font-size:20px}
.top .r{display:flex;align-items:center;gap:16px;font-size:14px;color:rgba(255,255,255,.65)}
.top button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.top button:hover{background:rgba(255,255,255,.1)}
.body{max-width:1280px;margin:0 auto;padding:32px 24px 140px}
.head h1{font-family:var(--serif);font-weight:300;font-size:38px}
.head p{color:var(--muted);margin-top:6px;max-width:52em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:28px 0}
.stat{background:#fff;padding:16px 20px}
.stat b{font-family:var(--serif);font-weight:300;font-size:30px;color:var(--wine);display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.tab{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer}
.tab:hover{border-color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:none}.panel.on{display:block}
.panel h2{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:6px}
.panel .desc{color:var(--muted);margin-bottom:22px;max-width:50em}
.note{background:#f8efdc;border:1px solid #e6d3a6;padding:12px 16px;font-size:14px;margin-bottom:22px;max-width:52em}

.drop{position:relative;border:2px dashed rgba(94,31,48,.3);background:#fff;padding:34px 20px;text-align:center;margin-bottom:22px;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--wine);background:#fbeff0}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop b{font-family:var(--serif);font-weight:400;font-size:20px;display:block;margin-bottom:4px}
.drop span{color:var(--muted);font-size:14px}
.drop.full{opacity:.55;cursor:not-allowed;border-style:solid}
.drop.full input{pointer-events:none}
.count{font-size:14px;color:var(--muted);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.item{background:#fff;border:1px solid var(--line)}
.item .im{aspect-ratio:4/5;background:#eadfd0;overflow:hidden}
.item .im img{width:100%;height:100%;object-fit:cover}
.item .bar{display:flex;border-top:1px solid var(--line)}
.item .bar button{flex:1;padding:9px 0;background:none;border:0;cursor:pointer;font-size:15px}
.item .bar button+button{border-left:1px solid var(--line)}
.item .bar button:hover{background:var(--ivory)}
.item .bar .del{color:var(--danger)}
.item .bar button:disabled{opacity:.3;cursor:default}
.emptybox{border:1px dashed rgba(22,15,20,.25);padding:40px;text-align:center;color:var(--muted)}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:26px}
.vcard{background:#fff;border:1px solid var(--line)}
.vcard .vt{aspect-ratio:16/9;background:#241a20;position:relative;overflow:hidden}
.vcard .vt img,.vcard .vt video{width:100%;height:100%;object-fit:cover}
.vcard .vt em{position:absolute;left:10px;top:10px;background:var(--brass);color:#1b1208;font-style:normal;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.vcard .vb{padding:14px}
.vcard input{width:100%;border:1px solid var(--line);padding:9px 12px;font:inherit;font-size:15px;margin-bottom:10px}
.vcard .vact{display:flex;gap:8px}
.sm{background:none;border:1px solid var(--line);padding:7px 14px;font-size:14px;cursor:pointer;border-radius:999px}
.sm:hover{border-color:var(--ink)}
.sm.del{color:var(--danger);border-color:rgba(179,38,30,.35)}
.sm.del:hover{background:var(--danger);color:#fff}
.addv{background:#fff;border:1px solid var(--line);padding:22px;max-width:640px}
.addv h3{font-family:var(--serif);font-weight:400;font-size:22px;margin-bottom:14px}
.addv .or{margin:14px 0;color:var(--muted);font-size:14px}
.addv input[type=text]{width:100%;border:1px solid var(--line);padding:11px 12px;font:inherit;margin-bottom:10px}
.btn{background:var(--wine);color:#fff;border:0;padding:11px 24px;font-weight:600;font-size:14px;cursor:pointer;border-radius:999px;position:relative;overflow:hidden;display:inline-block}
.btn:hover{background:var(--wine2)}
.btn:disabled{background:#999;cursor:not-allowed}
.btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hv{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:34px;max-width:720px}
.hv video{width:240px;aspect-ratio:16/9;object-fit:cover;background:#241a20}
.hv .e{width:240px;aspect-ratio:16/9;background:var(--ivory);display:grid;place-items:center;color:var(--muted);font-size:14px}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:300;background:var(--wine);color:#fff;padding:14px 24px;display:none;align-items:center;justify-content:space-between;gap:16px;border-top:3px solid var(--brass)}
.savebar.on{display:flex}
.savebar button{background:var(--brass);color:#1b1208;border:0;padding:11px 28px;font-weight:700;cursor:pointer;border-radius:999px}
.savebar button:disabled{opacity:.6}
.load{position:fixed;inset:0;background:rgba(251,247,241,.88);z-index:800;display:none;place-items:center}
.load.on{display:grid}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--wine);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.toasts{position:fixed;right:20px;bottom:90px;z-index:950;display:grid;gap:8px}
.toast{padding:12px 18px;font-size:14px;font-weight:500;color:#fff;background:var(--ink);max-width:320px;animation:t .25s}
.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}
@keyframes t{from{opacity:0;transform:translateY(8px)}}

/* ── iKON-style admin look ── */
.lbox{border-radius:0;border-top:3px solid var(--brass)}
.lbox h1{font-style:italic;font-weight:400;color:var(--ink)}
.lbox p{font-size:10px;letter-spacing:.35em;text-transform:uppercase}
.lbox label{font-size:8.5px;letter-spacing:.35em;text-transform:uppercase;color:var(--wine2)}
.lbox button{font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:500}
.top{border-bottom:1px solid rgba(212,160,48,.2);height:60px}
.top .logo{font-style:italic;font-size:20px}
.top .r{font-size:9px;letter-spacing:.3em;text-transform:uppercase}
.top button{border-radius:0;border-color:rgba(212,160,48,.35);color:var(--brass);font-size:9px;letter-spacing:.3em;text-transform:uppercase}
.head h1{font-weight:400;color:var(--wine);font-size:36px}
.head{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:0}
.stats{margin:32px 0 36px}
.stat b{font-weight:400;color:var(--wine)}
.stat span{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase}
.tabs{gap:0;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;margin-bottom:-1px;padding:12px 18px;font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.tab:hover{color:var(--wine);border-color:transparent}
.tab.on{background:none;color:var(--wine);border-bottom-color:var(--wine)}
.panel h2{font-weight:400;font-style:italic;color:var(--wine)}
.note{background:rgba(212,160,48,.07);border:1px solid rgba(212,160,48,.25)}
.drop{border-color:rgba(74,21,34,.2);border-radius:0}
.drop:hover,.drop.over{border-color:var(--wine);background:rgba(74,21,34,.03)}
.drop b{font-weight:400;color:var(--wine)}
.item,.vcard,.addv,.hv{border-radius:0}
.sm,.btn,.savebar button{border-radius:0;font-size:9px;letter-spacing:.25em;text-transform:uppercase;font-weight:600}
.btn{background:var(--wine)}
.btn:hover{background:var(--wine2)}
.vcard .vt em{border-radius:0;letter-spacing:.2em;text-transform:uppercase;font-size:8px}
.savebar{background:var(--wine);border-top:2px solid var(--brass)}
.savebar button{background:var(--brass);color:#1a1000}
.sm.del:hover{background:var(--danger)}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>Naveen Photography</h1>
    <p>Admin sign-in</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Sign in</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<div id="app" hidden>
  <div class="top">
    <span class="logo">Naveen Photography · Admin</span>
    <div class="r"><span id="saved">Not saved yet this session</span><button onclick="logout()">Sign out</button></div>
  </div>
  <div class="body">
    <div class="head">
      <h1>Site manager</h1>
      <p>Add or remove every photo and video on your website. Changes appear on the live site after you press Save.</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
  </div>
</div>

<div class="savebar" id="savebar"><span>You have unsaved changes. Save to update your live website.</span><button id="saveBtn" onclick="save()">Save changes</button></div>
<div class="load" id="load"><div style="text-align:center"><div class="spin"></div><div id="loadTxt">Loading</div></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* ═══════════════ CONFIG — edit these ═══════════════ */
const CLOUD_NAME    = 'ycleboim';
const UPLOAD_PRESET = 'naveen photography';
const JSONBIN_KEY   = '$2a$10$RjxthPmRs1dCJ7wC0eU1E.f8PvFhge/GSX0ls9nLNsCy0ABBHml5W';   // must match index.html
const JSONBIN_ID    = '6aca009cac6210605a24e0de';
const ADMIN_PASSWORD= 'naveenphotography2026';

const MAX_CAT=12, MAX_HERO=6, MAX_SNAP=24, MAX_VIDEOS=8;

/* Every spot on the website that shows a photo or video */
const IMG_SECTIONS = [
  {key:'heroImages', tab:'Hero', label:'Hero slideshow', max:MAX_HERO, desc:'Big photos behind the headline at the top of the site. They fade from one to the next. Use wide, high-quality landscape photos.'},
  {key:'aboutPhoto', tab:'About photo', label:'About photo', max:1, desc:'The portrait shown beside the About text. A vertical photo works best.'},
  {key:'logo', tab:'Logo', label:'Logo', max:1, desc:'Your logo, shown in the centre of the top bar. Use a PNG with a transparent background. If empty, the site shows the name as text.'},
  {key:'prewedding', tab:'Pre-wedding', label:'Pre-wedding', max:MAX_CAT},
  {key:'engagement', tab:'Engagement', label:'Engagement', max:MAX_CAT},
  {key:'haldi', tab:'Haldi and mehendi', label:'Haldi and mehendi', max:MAX_CAT},
  {key:'wedding', tab:'Wedding day', label:'Wedding day', max:MAX_CAT},
  {key:'reception', tab:'Reception', label:'Reception', max:MAX_CAT},
  {key:'candid', tab:'Candid portraits', label:'Candid portraits', max:MAX_CAT},
  {key:'snapshot', tab:'Scrolling strip', label:'Scrolling strip (Frames we love)', max:MAX_SNAP, desc:'The photos that scroll sideways near the bottom of the site. Each one links to your Instagram.'}
];
const TAB_ORDER = ['Hero','Logo','About photo','Pre-wedding','Engagement','Haldi and mehendi','Wedding day','Reception','Candid portraits','Video portfolio','Scrolling strip'];

let data = { logo:[], heroImages:[], heroVideo:'', heroVideoMobile:'', aboutPhoto:[], prewedding:[], engagement:[], haldi:[], wedding:[], reception:[], candid:[], snapshot:[], videos:[] };
let dirty=false, busy=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cld=(u,t)=>(u&&u.includes('/upload/'))?u.replace('/upload/','/upload/'+t+'/'):u;

/* ═══════════════ AUTH ═══════════════ */
function login(){
  if($('#pw').value===ADMIN_PASSWORD){ $('#login').hidden=true; $('#app').hidden=false; init(); }
  else{ $('#lerr').textContent='That password is not right. Try again.'; $('#pw').value=''; setTimeout(()=>$('#lerr').textContent='',3000); }
}
function logout(){
  if(dirty && !confirm('You have unsaved changes. Sign out anyway?')) return;
  dirty=false; location.reload();
}

/* ═══════════════ JSONBIN ═══════════════ */
function configured(){ return !JSONBIN_ID.startsWith('PASTE') && !CLOUD_NAME.startsWith('PASTE'); }
async function init(){
  buildTabs();
  if(!configured()){ render(); toast('Setup needed: add your JSONBin and Cloudinary details at the top of admin.html','err'); return; }
  showLoad('Loading your site');
  try{
    const r=await fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_ID+'/latest',{headers:{'X-Master-Key':JSONBIN_KEY}});
    if(!r.ok) throw new Error(r.status);
    const rec=(await r.json()).record||{};
    data={...data,...rec};
    Object.keys(data).forEach(k=>{ if(['heroVideo','heroVideoMobile'].includes(k)) return; if(!Array.isArray(data[k])) data[k]=[]; });
    if(typeof data.heroVideo!=='string') data.heroVideo=''; if(typeof data.heroVideoMobile!=='string') data.heroVideoMobile='';
    toast('Site loaded','ok');
  }catch(e){ console.error(e); toast('Could not load. Check the JSONBin key and bin ID.','err'); }
  hideLoad(); render();
}
async function save(){
  if(!configured()){ toast('Add your JSONBin and Cloudinary details first','err'); return; }
  const b=$('#saveBtn'); b.disabled=true; b.textContent='Saving';
  try{
    const r=await fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_ID,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY,'X-Bin-Versioning':'false'},body:JSON.stringify(data)});
    if(!r.ok) throw new Error(r.status);
    dirty=false; $('#savebar').classList.remove('on');
    $('#saved').textContent='Last saved '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    toast('Saved. Your website is updated.','ok');
  }catch(e){ console.error(e); toast('Save failed. Please try again.','err'); }
  b.disabled=false; b.textContent='Save changes';
}
function markDirty(){ dirty=true; $('#savebar').classList.add('on'); }
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* ═══════════════ CLOUDINARY ═══════════════ */
function upload(file,kind,folder,onProgress){
  return new Promise((resolve,reject)=>{
    const fd=new FormData(); fd.append('file',file); fd.append('upload_preset',UPLOAD_PRESET); fd.append('folder','naveen-photography/'+folder);
    const x=new XMLHttpRequest();
    x.open('POST','https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/'+kind+'/upload');
    x.upload.onprogress=e=>{ if(e.lengthComputable&&onProgress) onProgress(Math.round(e.loaded/e.total*100)); };
    x.onload=()=>{ try{ const j=JSON.parse(x.responseText); if(x.status>=200&&x.status<300&&j.secure_url) resolve(j.secure_url); else reject(new Error(j.error&&j.error.message||x.status)); }catch(err){reject(err);} };
    x.onerror=()=>reject(new Error('Network error'));
    x.send(fd);
  });
}

/* ═══════════════ TABS + RENDER ═══════════════ */
let curTab='Hero';
function buildTabs(){
  $('#tabs').innerHTML=TAB_ORDER.map(t=>'<button class="tab'+(t===curTab?' on':'')+'" data-t="'+t+'">'+t+'</button>').join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;buildTabs();render();});
}
function render(){
  stats();
  const p=$('#panels');
  if(curTab==='Video portfolio'){ p.innerHTML='<div class="panel on">'+videoPanel()+'</div>'; bindVideoPanel(); return; }
  const sec=IMG_SECTIONS.find(s=>s.tab===curTab);
  let h='<div class="panel on"><h2>'+sec.label+'</h2>';
  if(sec.desc) h+='<p class="desc">'+sec.desc+'</p>';
  if(sec.key==='heroImages') h+=heroVideoBox();
  h+=imgManager(sec)+'</div>';
  p.innerHTML=h;
  bindImgManager(sec);
  if(sec.key==='heroImages') bindHeroVideo();
}
function stats(){
  const portfolio=['prewedding','engagement','haldi','wedding','reception','candid'].reduce((s,k)=>s+(data[k]||[]).length,0);
  $('#stats').innerHTML=[
    [(data.heroImages||[]).length+(data.heroVideo?' + video':''),'Hero media'],
    [portfolio,'Portfolio photos'],[(data.videos||[]).length,'Films'],[(data.snapshot||[]).length,'Strip photos']
  ].map(([n,l])=>'<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>').join('');
}

/* ═══════════════ IMAGE MANAGER ═══════════════ */
function imgManager(sec){
  const list=data[sec.key]||[]; const full=list.length>=sec.max;
  let h='<div class="drop'+(full?' full':'')+'" id="drop"><input type="file" id="fileIn" accept="image/*"'+(sec.max>1?' multiple':'')+(full?' disabled':'')+'>'
    +'<b>'+(full?'This section is full':(sec.max===1?'Drop a photo or click to choose':'Drop photos or click to choose'))+'</b>'
    +'<span>'+(full?'Remove a photo to add another.':'JPG, PNG or WebP. You can pick several at once. Uploads start right away.')+'</span></div>';
  h+='<p class="count">'+list.length+' of '+sec.max+' photos'+(sec.max>1?'. Use the arrows to change the order.':'')+'</p>';
  if(!list.length) return h+'<div class="emptybox">No photos here yet.</div>';
  h+='<div class="grid">'+list.map((u,i)=>'<div class="item"><div class="im"><img src="'+esc(cld(u,'q_auto,f_auto,w_320'))+'" alt="" loading="lazy"></div><div class="bar"><button data-a="l" data-i="'+i+'" title="Move earlier"'+(i===0?' disabled':'')+'>←</button><button data-a="r" data-i="'+i+'" title="Move later"'+(i===list.length-1?' disabled':'')+'>→</button><button class="del" data-a="d" data-i="'+i+'" title="Remove">Remove</button></div></div>').join('')+'</div>';
  return h;
}
function bindImgManager(sec){
  const inp=$('#fileIn'), drop=$('#drop');
  if(inp) inp.onchange=()=>uploadImages(sec,[...inp.files]);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over'); if(!drop.classList.contains('full')) uploadImages(sec,[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')));};
  $('#panels').querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, list=data[sec.key];
    if(b.dataset.a==='d'){ if(!confirm('Remove this photo from the website? It stays in your Cloudinary library.')) return; list.splice(i,1); }
    if(b.dataset.a==='l'&&i>0) [list[i-1],list[i]]=[list[i],list[i-1]];
    if(b.dataset.a==='r'&&i<list.length-1) [list[i+1],list[i]]=[list[i],list[i+1]];
    markDirty(); render();
  });
}
async function uploadImages(sec,files){
  if(busy||!files.length) return;
  if(!configured()){ toast('Add your JSONBin and Cloudinary details first','err'); return; }
  const list=data[sec.key]; const room=sec.max-list.length;
  if(files.length>room){ toast('Only '+room+' space'+(room===1?'':'s')+' left. Uploading the first '+room+'.','err'); files=files.slice(0,room); }
  busy=true; let ok=0;
  for(let i=0;i<files.length;i++){
    showLoad('Uploading photo '+(i+1)+' of '+files.length);
    try{ const url=await upload(files[i],'image',sec.key); list.push(url); ok++; markDirty(); }
    catch(e){ console.error(e); toast('Could not upload '+files[i].name+': '+e.message,'err'); }
  }
  busy=false; hideLoad(); render();
  if(ok) toast(ok+' photo'+(ok>1?'s':'')+' added. Press Save to publish.','ok');
}

/* ═══════════════ HERO VIDEOS ═══════════════ */
function vslot(key,label,hint){
  const v=data[key];
  return '<div class="hv">'+(v?'<video src="'+esc(v)+'" muted loop playsinline controls preload="metadata"></video>':'<div class="e">No video</div>')
   +'<div><b style="font-family:var(--serif);font-weight:400;font-size:20px">'+label+'</b><p style="color:var(--muted);font-size:14px;margin:4px 0 14px;max-width:26em">'+hint+'</p>'
   +(v?'<button class="sm del" data-hvdel="'+key+'">Remove video</button>':'<label class="btn">Upload video<input type="file" data-hvin="'+key+'" accept="video/*"></label>')+'</div></div>';
}
function heroVideoBox(){
  return '<div class="note">Optional: add hero videos. When a video is saved it plays behind the buttons instead of the photo slideshow. Add a wide video for computers and a tall one for phones. If you only add one, it is used on both. Remove the videos to go back to the slideshow. Keep each under 100 MB (Cloudinary free plan limit).</div>'
   +vslot('heroVideo','Computer hero video','Wide (landscape) video for computers and tablets.')
   +vslot('heroVideoMobile','Phone hero video','Tall (portrait) video for phones.')
   +'<h2 style="font-size:22px;margin:30px 0 10px">Slideshow photos (shown only when no video is saved)</h2>';
}
function bindHeroVideo(){
  $('#panels').querySelectorAll('[data-hvdel]').forEach(b=>b.onclick=()=>{ if(!confirm('Remove this hero video?')) return; data[b.dataset.hvdel]=''; markDirty(); render(); });
  $('#panels').querySelectorAll('[data-hvin]').forEach(i=>i.onchange=async()=>{
    const f=i.files[0], key=i.dataset.hvin; if(!f) return;
    if(!configured()){ toast('Add your JSONBin and Cloudinary details first','err'); return; }
    showLoad('Uploading hero video');
    try{ data[key]=await upload(f,'video','hero',p=>$('#loadTxt').textContent='Uploading hero video '+p+'%'); markDirty(); toast('Hero video added. Press Save to publish.','ok'); }
    catch(e){ console.error(e); toast('Video upload failed: '+e.message,'err'); }
    hideLoad(); render();
  });
}

/* ═══════════════ VIDEO PORTFOLIO ═══════════════ */
function ytParse(u){ const m=String(u).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/); return m?m[1]:''; }
function poster(v){
  if(v.type==='yt') return 'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg';
  return cld(v.url,'so_1,w_640,h_360,c_fill,f_jpg').replace(/\.[a-z0-9]+(\?.*)?$/i,'.jpg');
}
function videoPanel(){
  const list=data.videos||[]; const full=list.length>=MAX_VIDEOS;
  let h='<h2>Video portfolio</h2><p class="desc">The wedding films in the "Wedding films" section. Up to '+MAX_VIDEOS+'. Each film shows its title on the website.</p>';
  h+='<p class="count">'+list.length+' of '+MAX_VIDEOS+' films</p>';
  h+=list.length?'<div class="vgrid">'+list.map((v,i)=>'<div class="vcard"><div class="vt"><img src="'+esc(poster(v))+'" alt=""><em>'+(v.type==='yt'?'YouTube':'Uploaded')+'</em></div><div class="vb"><input type="text" data-t="'+i+'" value="'+esc(v.title||'')+'" placeholder="Film title"><div class="vact"><button class="sm" data-v="l" data-i="'+i+'"'+(i===0?' disabled':'')+'>←</button><button class="sm" data-v="r" data-i="'+i+'"'+(i===list.length-1?' disabled':'')+'>→</button><button class="sm del" data-v="d" data-i="'+i+'">Remove</button></div></div></div>').join('')+'</div>':'<div class="emptybox" style="margin-bottom:26px">No films yet.</div>';
  h+='<div class="addv"><h3>Add a film</h3>'
    +(full?'<p style="color:var(--muted)">All '+MAX_VIDEOS+' slots are used. Remove a film to add another.</p>':
    '<input type="text" id="vTitle" placeholder="Film title, e.g. Priya and Arjun, Hyderabad"><label class="btn">Upload a video file<input type="file" id="vFile" accept="video/*"></label><div class="or">or paste a YouTube link (best for long films)</div><input type="text" id="vYt" placeholder="https://youtube.com/watch?v=..."><button class="btn" id="vYtAdd">Add YouTube film</button>')
    +'</div>';
  return h;
}
function bindVideoPanel(){
  $('#panels').querySelectorAll('input[data-t]').forEach(i=>i.oninput=()=>{ data.videos[+i.dataset.t].title=i.value; markDirty(); });
  $('#panels').querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, l=data.videos;
    if(b.dataset.v==='d'){ if(!confirm('Remove this film from the website?')) return; l.splice(i,1); }
    if(b.dataset.v==='l'&&i>0) [l[i-1],l[i]]=[l[i],l[i-1]];
    if(b.dataset.v==='r'&&i<l.length-1) [l[i+1],l[i]]=[l[i],l[i+1]];
    markDirty(); render();
  });
  const f=$('#vFile'), y=$('#vYtAdd');
  if(f) f.onchange=async()=>{
    const file=f.files[0]; if(!file) return;
    if(!configured()){ toast('Add your JSONBin and Cloudinary details first','err'); return; }
    showLoad('Uploading film');
    try{ const url=await upload(file,'video','films',p=>$('#loadTxt').textContent='Uploading film '+p+'%');
      data.videos.push({type:'cld',url,title:$('#vTitle').value.trim()||'Wedding film'}); markDirty(); toast('Film added. Press Save to publish.','ok'); }
    catch(e){ console.error(e); toast('Video upload failed: '+e.message,'err'); }
    hideLoad(); render();
  };
  if(y) y.onclick=()=>{
    const id=ytParse($('#vYt').value); if(!id){ toast('That does not look like a YouTube link','err'); return; }
    data.videos.push({type:'yt',id,title:$('#vTitle').value.trim()||'Wedding film'}); markDirty(); render(); toast('Film added. Press Save to publish.','ok');
  };
}

/* ═══════════════ UI HELPERS ═══════════════ */
function showLoad(t){ $('#loadTxt').textContent=t; $('#load').classList.add('on'); }
function hideLoad(){ $('#load').classList.remove('on'); }
function toast(m,t){ const e=document.createElement('div'); e.className='toast '+(t||''); e.textContent=m; $('#toasts').appendChild(e); setTimeout(()=>e.remove(),4200); }
</script>
</body>
</html>
